name: Validate and deploy to AWS
'on':
  pull_request:
    branches:
    - develop
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: npm run build
      env:
        VITE_API_URL: https://example.invalid
        VITE_JAVA_API_URL: https://example.invalid
        VITE_AI_API_URL: https://example.invalid/ai
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      PRODUCTION_BRANCH: ${{ vars.PRODUCTION_BRANCH }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_JAVA_API_URL: ${{ vars.VITE_JAVA_API_URL }}
      VITE_AI_API_URL: ${{ vars.VITE_AI_API_URL }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Check deployment configuration
      shell: bash
      run: "set -euo pipefail\nfor key in AWS_REGION AWS_ROLE_ARN AWS_ACCOUNT_ID PRODUCTION_BRANCH;\
        \ do\n  [[ -n \"${!key}\" ]] || { echo \"::error::Configure the GitHub production\
        \ variable $key\"; exit 1; }\ndone\n[[ \"$GITHUB_REF\" == \"refs/heads/$PRODUCTION_BRANCH\"\
        \ ]] || { echo \"::error::Select the configured production branch\"; exit\
        \ 1; }\n"
    - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
        allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
    - name: Build and publish frontend
      run: bash scripts/deploy-frontend.sh
