name: Fix frontend npm advisories (isolated branch)

on:
  push:
    branches: [security/frontend-npm-audit-20261010]
    paths: [.github/workflows/fix-npm-audit.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/security/frontend-npm-audit-20261010'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Upgrade React Router to patched major version
        run: npm install 'react-router-dom@^7.18.0' --save --no-fund
      - name: Apply compatible transitive dependency fixes
        run: npm audit fix --no-fund
      - name: Assert no npm advisories remain
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
      - name: Verify regressions
        run: |
          npm run test:ai
          node --test tests/auth-storage.test.mjs
          python3 -m unittest discover -s tests -p 'test_deploy*.py' -v
          bash -n scripts/check-deploy-config.sh scripts/deploy-frontend.sh
          npm run build
        env:
          VITE_API_URL: https://example.invalid
          VITE_JAVA_API_URL: https://example.invalid/java
          VITE_AI_API_URL: https://example.invalid/ai
      - name: Commit validated lockfile changes to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency modifications needed"
          else
            git commit -m "fix(deps): resolve npm audit advisories without forced upgrades"
            git push origin HEAD:security/frontend-npm-audit-20261010
          fi
